<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <link rel="stylesheet" href="/src/css/style.css"/>
    <link rel="stylesheet" href="/src/css/menu.css"/>
    <link rel="stylesheet" href="/src/css/carousel.css"/>
    <title>Tumai</title>
</head>
<body>
<div id="menu">

  <div id="topper">
    <h1>Chose file:</h1>
  </div>


  <div id="content">
    <div class="butoni">
      <button id="add_new" class="action">
        <p>Add new file...</p>
      </button>
      <button id="save_list" class="action">
        <p>Save the List</p>
      </button>
    </div>

    <div id="list">
      <p class="def">Loading...</p>
    </div>

  </div>

</div>


<div id="carousel">
  <div id="top">
    <h1 style="color: #333333;">Loading...</h1>
  </div>

  <div class="navi">
    <button id="go_to_menu">
      <p>&lt;</p>
    </button>
    <button id="what">
      <p>Show:</p>
    </button>
    <button id="select">
      <p>Filter:</p>
    </button>
    <button id="order">
      <p>Order:</p>
    </button>
    <button id="save_file">
      <p>Save Progress</p>
    </button>
  </div>

    <button id="stage">
      <p id="name"></p>
      <p id="phonetic"></p>
      <p id="meaning"></p>
      <p id="notes"></p>
    </button>

    <div class="navi" id="bottom">
      <p id="score"></p>
      <button id="previous">
        <p>&lt;</p>
      </button>
      <button id="learned">
        <p>Next!</p>
      </button>
      <button id="next">
        <p>&gt;</p>
      </button>
    </div>
</div>





  <!--  SCRIPTS  -->
  <script src="./src/main.js" type="module"></script>

</body>
</html>
